[project]
name = "decision-models"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Jettro Coenradie", email = "jettro@coenradie.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.3",
    "openai>=3.31.0",
    "pydantic-ai>=2.57.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
decision-models = "decision_models:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
